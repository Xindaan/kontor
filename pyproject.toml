[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "kontor"
version = "0.2.0"
description = "Kontor — tax-aware, point-in-time backtesting for German investors, with German capital-gains tax modelling and plan-only broker order derivation."
authors = ["André"]
readme = "README.md"
packages = [{include = "backtest", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0.0"
numpy = "^1.24.0"
yfinance = "^0.2.0"
jinja2 = "^3.1.0"
plotly = "^5.18.0"
requests = "^2.31.0"
pdfplumber = "^0.11.0"
beautifulsoup4 = "^4.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.0.0"

[tool.poetry.group.web]
optional = true

[tool.poetry.group.web.dependencies]
fastapi = "^0.141.0"
uvicorn = "^0.52.0"
# Deliberately NOT a caret: `^0.0.x` resolves to `<0.0.x+1` under Poetry, and
# this package accounted for 9 of the 51 advisories open in 2026 — a caret would
# have required a pyproject edit for every future 0.0.x fix instead of a plain
# `poetry update`.
python-multipart = ">=0.0.32,<0.1.0"

# Phase C: lightweight sentiment engine. NLTK ships the VADER lexicon
# but the lexicon itself must be downloaded once via
# `python -m nltk.downloader vader_lexicon` (no runtime download).
[tool.poetry.group.sentiment]
optional = true

[tool.poetry.group.sentiment.dependencies]
nltk = "^3.8"

# The optional `sentiment-finbert` group (transformers + torch) was REMOVED on
# 2026-08-13. It was never installed here, and through the lock file it pulled in
# the whole CUDA/torch tree plus a standing set of transformers advisories. A
# major bump would not have been covered by the test suite -- the group is not
# installed, so nothing exercises it -- and would have traded a visible advisory
# for an invisible break.
#
# The CODE stays: `FinBERTSentimentEngine` and the `--news-engine finbert` choice
# are unchanged; the lazy import now points at `pip install transformers torch`.
# Whoever needs the engine picks the version current at install time instead of
# freezing it in the lock months in advance.

# Phase D: ML-Forecast pipeline (LightGBM, xgboost, sklearn). Core code
# imports these lazily so Phase A/B/C tests stay green without this
# group installed. Tests that exercise the real models are marked
# `ml_extras` and can be run separately.
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
lightgbm = "^4.0"
xgboost = "^2.0"
scikit-learn = "^1.3"

[tool.poetry.scripts]
backtest = "backtest.cli:app"
backtest-constituents = "backtest.constituents.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "no_network: marks tests that must not perform network IO",
    "ml_extras: marks tests that need lightgbm/xgboost/sklearn (poetry --with ml)",
    "dl_extras: marks tests that need pytorch (poetry --with dl) — Phase E3",
    "live_extras: marks tests that need alpaca-py (poetry --with live) — Phase E2",
]
filterwarnings = [
    "ignore:np.find_common_type is deprecated.*:DeprecationWarning",
    "ignore:\\[WARNING\\] \\[metrics\\] Sortino ratio is not finite:UserWarning",
    "ignore:\\[WARNING\\] \\[gross\\.metrics\\] Sortino ratio is not finite:UserWarning",
    "ignore:\\[WARNING\\] \\[invariant\\] effective_tax_rate exceeds nominal tax rate.*:UserWarning",
    "ignore:PIT universe CSV not found.*:UserWarning",
]
